[env:cardputer-adv]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
build_unflags = -DARDUINO_USB_MODE=1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=0
lib_deps =
  m5stack/M5Cardputer@1.1.1
  m5stack/M5Unified@0.2.21
  m5stack/M5GFX@0.2.28
monitor_speed = 115200



[env:cardputer-adv-recovery]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -DAHA_RECOVERY_NO_WIFI=1

[env:cardputer-adv-ble]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -DAHA_VOICE_BLE_ONLY=1
